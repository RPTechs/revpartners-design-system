<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 854px; }
  body { display: flex; }
  .main { flex: 1; background: #17B452; display: flex; align-items: center; justify-content: center; padding: 0 90px; }
  .main img { width: 100%; max-width: 760px; height: auto; }
  .strip { width: 220px; display: flex; flex-direction: column; }
  .strip > div { flex: 1; }
  .s-orange { background: #EF811B; }
  .s-blue   { background: #319AFB; }
  .s-red    { background: #FB3131; }
  .s-purple { background: #8C32FF; }
</style>
</head>
<body>
  <div class="main">
    <img src="assets/RevPartners-Logo-2024-White.svg" alt="RevPartners">
  </div>
  <div class="strip">
    <div class="s-orange"></div>
    <div class="s-blue"></div>
    <div class="s-red"></div>
    <div class="s-purple"></div>
  </div>
</body>
</html>
