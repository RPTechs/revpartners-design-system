<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display Type" subtitle="Montserrat Bold (700) — hero to h5" viewport="700x360" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFDFD; font-family: 'Montserrat', sans-serif; padding: 20px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid rgba(36,39,58,0.06); }
  .row:last-child { border-bottom: none; }
  .meta { width: 140px; flex-shrink: 0; }
  .meta-size { font-size: 10px; font-weight: 600; color: #A1A2A7; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Inter', sans-serif; }
  .meta-var { font-size: 10px; color: #17B451; font-family: 'Inter', sans-serif; font-weight: 600; margin-top: 2px; }
  .specimen { color: #24273A; font-weight: 700; }
  .label-specimen { font-size: 20px; font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; color: #17B451; }
</style>
</head>
<body>
  <div class="row">
    <div class="meta"><div class="meta-size">64px · Bold</div><div class="meta-var">--text-hero</div></div>
    <div class="specimen" style="font-size:52px;line-height:1.1;">Revenue</div>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-size">48px · Bold</div><div class="meta-var">--text-h1</div></div>
    <div class="specimen" style="font-size:42px;line-height:1.2;">Grow with Confidence</div>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-size">32px · Bold</div><div class="meta-var">--text-h2</div></div>
    <div class="specimen" style="font-size:28px;line-height:1.25;">GTM Engineering on HubSpot</div>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-size">28px · Bold</div><div class="meta-var">--text-h3</div></div>
    <div class="specimen" style="font-size:24px;line-height:1.25;">Your GTM is a product</div>
  </div>
  <div class="row">
    <div class="meta"><div class="meta-size">20px · AllCaps label</div><div class="meta-var">--rp-label</div></div>
    <div class="label-specimen">Diagnosis</div>
  </div>
</body>
</html>
