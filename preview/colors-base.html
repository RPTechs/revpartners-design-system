<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Base Colors" subtitle="Neutrals + Rally Green primary" viewport="700x280" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFDFD; font-family: 'Inter', sans-serif; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .swatch { border-radius: 8px; overflow: hidden; }
  .swatch-color { height: 72px; }
  .swatch-info { padding: 8px 10px; background: #fff; border: 1px solid rgba(36,39,58,0.08); border-top: none; border-radius: 0 0 8px 8px; }
  .swatch-name { font-weight: 700; font-size: 12px; color: #434761; }
  .swatch-hex { font-family: 'Inter', sans-serif; font-size: 11px; color: #A1A2A7; margin-top: 2px; }
  .swatch-role { font-size: 10px; color: #A1A2A7; margin-top: 2px; }
  .off-white-swatch .swatch-color { border: 1px solid rgba(36,39,58,0.1); border-bottom: none; }
</style>
</head>
<body>
<div class="grid">
  <div class="swatch">
    <div class="swatch-color" style="background:#17B451;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Rally Green</div>
      <div class="swatch-hex">#17B451</div>
      <div class="swatch-role">Primary accent</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#D1F0DC;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Mint</div>
      <div class="swatch-hex">#D1F0DC</div>
      <div class="swatch-role">Soft bg accent</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#434761;"></div>
    <div class="swatch-info">
      <div class="swatch-name">River Bed</div>
      <div class="swatch-hex">#434761</div>
      <div class="swatch-role">Secondary text</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#A1A2A7;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Steel</div>
      <div class="swatch-hex">#A1A2A7</div>
      <div class="swatch-role">Muted / lines</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#24273A;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Ebony Clay</div>
      <div class="swatch-hex">#24273A</div>
      <div class="swatch-role">Dark bg / primary text</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#F3F3F4; border: 1px solid rgba(36,39,58,0.08); border-bottom:none;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Mercury</div>
      <div class="swatch-hex">#F3F3F4</div>
      <div class="swatch-role">Alt section bg</div>
    </div>
  </div>
  <div class="swatch off-white-swatch">
    <div class="swatch-color" style="background:#FDFDFD;"></div>
    <div class="swatch-info">
      <div class="swatch-name">Off White</div>
      <div class="swatch-hex">#FDFDFD</div>
      <div class="swatch-role">Page background</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#FFFFFF; border: 1px solid rgba(36,39,58,0.08); border-bottom:none;"></div>
    <div class="swatch-info">
      <div class="swatch-name">White</div>
      <div class="swatch-hex">#FFFFFF</div>
      <div class="swatch-role">Cards / surfaces</div>
    </div>
  </div>
</div>
</body>
</html>
