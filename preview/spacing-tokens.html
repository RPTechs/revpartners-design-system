<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="gap-xs through gap-xl tokens" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFDFD; font-family: 'Inter', sans-serif; padding: 20px 24px; }
  .row { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .bar-wrap { flex: 1; }
  .bar { height: 18px; background: #17B452; border-radius: 3px; opacity: 0.85; }
  .label { width: 100px; font-size: 11px; font-weight: 600; color: #434761; flex-shrink: 0; }
  .token { width: 160px; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #17B452; background: #D1F0DC; padding: 2px 6px; border-radius: 3px; flex-shrink: 0; }
  .px { width: 42px; font-size: 10px; color: #A1A2A7; text-align: right; flex-shrink: 0; }
  .header { display: flex; gap: 16px; margin-bottom: 10px; }
  .header span { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #A1A2A7; }
</style>
</head>
<body>
  <div class="header">
    <span style="width:100px;">Name</span>
    <span style="width:160px;">Token</span>
    <span>Scale</span>
    <span style="margin-left:auto;">px</span>
  </div>
  <div class="row"><div class="label">XS Gap</div><div class="token">--gap-xs</div><div class="bar-wrap"><div class="bar" style="width:6.7%;"></div></div><div class="px">8px</div></div>
  <div class="row"><div class="label">Gap S</div><div class="token">--gap-s</div><div class="bar-wrap"><div class="bar" style="width:13.3%;"></div></div><div class="px">16px</div></div>
  <div class="row"><div class="label">Gap (base)</div><div class="token">--gap</div><div class="bar-wrap"><div class="bar" style="width:20%; opacity:1;"></div></div><div class="px">24px</div></div>
  <div class="row"><div class="label">Gap M</div><div class="token">--gap-m</div><div class="bar-wrap"><div class="bar" style="width:40%;"></div></div><div class="px">48px</div></div>
  <div class="row"><div class="label">Gap L</div><div class="token">--gap-l</div><div class="bar-wrap"><div class="bar" style="width:50%;"></div></div><div class="px">60px</div></div>
  <div class="row"><div class="label">Gap XL</div><div class="token">--gap-xl</div><div class="bar-wrap"><div class="bar" style="width:100%;"></div></div><div class="px">120px</div></div>
</body>
</html>
