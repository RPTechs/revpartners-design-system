<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Accent Colors" subtitle="Functional accents — RevOps, Growth, HubSpot, Sales, Tech" viewport="700x360" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFDFD; font-family: 'Inter', sans-serif; padding: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: stretch; }
  .label { font-size: 10px; font-weight: 700; color: #A1A2A7; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .pair { display: flex; gap: 6px; flex: 1; }
  .swatch { border-radius: 8px; overflow: hidden; flex: 1; }
  .swatch-color { height: 60px; }
  .swatch-info { padding: 6px 8px; background: #fff; border: 1px solid rgba(36,39,58,0.08); border-top: none; border-radius: 0 0 8px 8px; }
  .swatch-name { font-weight: 700; font-size: 11px; color: #434761; }
  .swatch-hex { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #A1A2A7; margin-top: 1px; }
  .swatch-role { font-size: 10px; color: #A1A2A7; margin-top: 1px; }
</style>
</head>
<body>
<div class="label">Accent Colors — each maps to a service area</div>
<div class="row">
  <div class="pair">
    <div class="swatch">
      <div class="swatch-color" style="background:#17B452;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Rally Green</div>
        <div class="swatch-hex">#17B452</div>
        <div class="swatch-role">RevOps</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#D1F0DC;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Mint</div>
        <div class="swatch-hex">#D1F0DC</div>
        <div class="swatch-role">20% bg</div>
      </div>
    </div>
  </div>
  <div class="pair">
    <div class="swatch">
      <div class="swatch-color" style="background:#329DFF;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Fast Blue</div>
        <div class="swatch-hex">#329DFF</div>
        <div class="swatch-role">Growth</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#CCE7FF;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Sky</div>
        <div class="swatch-hex">#CCE7FF</div>
        <div class="swatch-role">20% bg</div>
      </div>
    </div>
  </div>
  <div class="pair">
    <div class="swatch">
      <div class="swatch-color" style="background:#F7761E;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Tango</div>
        <div class="swatch-hex">#F7761E</div>
        <div class="swatch-role">HubSpot</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#FEE4D5;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Peach</div>
        <div class="swatch-hex">#FEE4D5</div>
        <div class="swatch-role">20% bg</div>
      </div>
    </div>
  </div>
  <div class="pair">
    <div class="swatch">
      <div class="swatch-color" style="background:#FB3131;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Racecar Red</div>
        <div class="swatch-hex">#FB3131</div>
        <div class="swatch-role">Sales</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#FFD9D7;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Coral</div>
        <div class="swatch-hex">#FFD9D7</div>
        <div class="swatch-role">20% bg</div>
      </div>
    </div>
  </div>
  <div class="pair">
    <div class="swatch">
      <div class="swatch-color" style="background:#8C32FF;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Ultra Purple</div>
        <div class="swatch-hex">#8C32FF</div>
        <div class="swatch-role">Tech</div>
      </div>
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background:#E9D6FF;"></div>
      <div class="swatch-info">
        <div class="swatch-name">Lavender</div>
        <div class="swatch-hex">#E9D6FF</div>
        <div class="swatch-role">20% bg</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
