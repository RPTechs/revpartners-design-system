<!DOCTYPE html>
<!-- @dsCard group="Components" name="Step Sequence" subtitle="Filled circles, white numerals, dashed connectors — accent cycle green→blue→orange→red→purple" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FDFDFD; font-family: 'Inter', sans-serif; padding: 28px 24px; }
  .steps { display: flex; align-items: flex-start; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 108px; flex-shrink: 0; }
  .num { width: 48px; height: 48px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px; color: #fff; }
  .step:nth-child(odd) .num, .green { background: #17B451; }
  .connector { flex: 1; border-top: 2px dashed rgba(36,39,58,0.25); margin-top: 24px; min-width: 24px; }
  .s1 { background: #17B451; } .s2 { background: #329DFF; } .s3 { background: #F7761E; } .s4 { background: #FB3131; } .s5 { background: #8C32FF; }
  .caption { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: #434761; text-align: center; line-height: 1.35; }
</style>
</head>
<body>
  <div class="steps">
    <div class="step"><div class="num s1">1</div><div class="caption">Diagnose</div></div>
    <div class="connector"></div>
    <div class="step"><div class="num s2">2</div><div class="caption">Design</div></div>
    <div class="connector"></div>
    <div class="step"><div class="num s3">3</div><div class="caption">Build</div></div>
    <div class="connector"></div>
    <div class="step"><div class="num s4">4</div><div class="caption">Adopt</div></div>
    <div class="connector"></div>
    <div class="step"><div class="num s5">5</div><div class="caption">Iterate</div></div>
  </div>
</body>
</html>
