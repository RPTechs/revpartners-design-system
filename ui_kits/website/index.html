<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Website" name="Website UI Kit" subtitle="revpartners.io recreation — Home / Services / HubSpot / Pricing" viewport="1440x900" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevPartners — Website UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@40,400,0,0"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #FDFDFD; font-family: 'Inter', sans-serif; overflow-x: hidden; }
  #root { width: 100%; }
  /* Page tabs */
  .page-tabs { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1000; background: #24273A; border-radius: 120px; display: flex; gap: 4px; padding: 6px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
  .page-tab { border-radius: 120px; border: none; background: none; color: rgba(253,253,253,0.55); font-family: 'Inter',sans-serif; font-weight: 600; font-size: 13px; padding: 8px 18px; cursor: pointer; transition: all 0.15s; }
  .page-tab.active { background: #17B451; color: #FDFDFD; }
  .page-tab:hover:not(.active) { color: #FDFDFD; }
</style>
</head>
<body>
<div id="root"></div>
<div class="page-tabs" id="tabs"></div>

<script type="text/babel" src="header.jsx"></script>
<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="footer.jsx"></script>

<script type="text/babel">
// ── Page definitions ──────────────────────────────────────────────

const SERVICES = [
  { color:"#17B451", icon:"manage_accounts",  title:"Fractional RevOps",     body:"An experienced RevOps department embedded in your team for predictable, repeatable revenue outcomes.", link:"I need revenue visibility" },
  { color:"#329DFF", icon:"conversion_path",  title:"Allbound Marketing",     body:"Meet buyers where they are through paid media, dynamic content, and warm outreach triggered by intent signals.", link:"I need to drive growth" },
  { color:"#8C32FF", icon:"looks",            title:"Clay Implementations",   body:"The foundational build and playbooks you need to make Clay your unfair advantage.", link:"I need help with Clay" },
  { color:"#F7761E", icon:"hub",              title:"HubSpot Integrations",    body:"Disconnected tools waste time and money. We turn silos into operational synergy.", link:"Connect my tech" },
  { color:"#FB3131", icon:"delivery_truck_speed", title:"HubSpot Migrations",  body:"No one likes CRM migrations. We'll make sure yours is the last you ever do.", link:"I'm ready to move" },
  { color:"#17B451", icon:"deployed_code_update", title:"HubSpot Implementations", body:"50% of CRM implementations fail. We make sure you avoid becoming another statistic.", link:"Get started on HubSpot" },
];

const RPM_STEPS = [
  { num:"1", label:"Diagnose", desc:"Map the GTM motion" },
  { num:"2", label:"Design",   desc:"Architect the system" },
  { num:"3", label:"Build",    desc:"Configure & integrate" },
  { num:"4", label:"Adopt",    desc:"Enablement & training" },
  { num:"5", label:"Iterate",  desc:"Measure & optimize" },
];

const STATS = [
  { number:"3.2×",  label:"Average pipeline velocity improvement",           accent:"#17B451" },
  { number:"90d",   label:"Median time-to-value from kickoff to full RevOps", accent:"#329DFF" },
  { number:"180+",  label:"HubSpot implementations delivered",                accent:"#F7761E" },
  { number:"$2.4B", label:"Revenue influenced through the RPM framework",     accent:"#FB3131" },
];

// ── Pages ─────────────────────────────────────────────────────────

function HomePage() {
  return (
    <div>
      <RPHeader activePage="revops" />
      <RPHero />

      {/* RevOps As a Service section */}
      <TextImageSection
        eyebrow="Revenue Operations"
        title="RevOps as a Service"
        body="Operationalize your success to achieve the fastest time-to-value from your Sales, Marketing, and Customer Success. We aren't afraid to zoom in and get technical."
        cta="Get Started"
        ctaSecondary="Find out how"
        bg="#FDFDFD"
      />

      {/* Stats row */}
      <section style={{background:"#F3F3F4", padding:"60px 120px", display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:20}}>
        {STATS.map((s,i) => <StatCard key={i} {...s} />)}
      </section>

      {/* Services grid */}
      <ServiceGrid services={SERVICES} />

      {/* RPM Pipeline diagram */}
      <DiagramSection
        title="The Revenue Performance Model"
        body="Our proprietary framework connects every stage of your go-to-market motion — from first touch to expansion revenue."
        steps={RPM_STEPS}
      />

      {/* HubSpot section */}
      <TextImageSection
        eyebrow="HubSpot"
        title="The New Way to Grow"
        body="HubSpot isn't just a CRM — it's the operating system for modern revenue teams. We implement, configure, and optimize every Hub so your team can focus on selling."
        cta="See Our Work"
        ctaSecondary="View case studies"
        bg="#FDFDFD"
        flip={true}
      />

      {/* CTA Banner */}
      <CTABanner
        title="Ready to Build Your Revenue Engine?"
        body="Start with a free RevOps assessment. We'll map your current GTM motion and show you exactly where to unlock growth."
        cta="Book a Call"
      />

      <RPFooter />
    </div>
  );
}

function ServicesPage() {
  return (
    <div>
      <RPHeader activePage="revops" />
      {/* Page hero */}
      <section style={{background:"rgba(23,180,81,0.06)", padding:"80px 120px 64px", display:"flex", flexDirection:"column", gap:16}}>
        <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:14,letterSpacing:"0.4em",textTransform:"uppercase",color:"#17B451"}}>What We Do</div>
        <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:56,lineHeight:1.1,color:"#24273A",maxWidth:700}}>GTM Engineering on HubSpot</h1>
        <p style={{fontFamily:"'Inter',sans-serif",fontSize:18,lineHeight:1.75,color:"#434761",maxWidth:560}}>
          We architect, implement, and optimize revenue operations for companies that can't afford to guess. Every engagement is measurable, every deliverable is documented.
        </p>
      </section>
      <ServiceGrid services={SERVICES} />
      <DiagramSection title="How We Work" body="Every engagement follows a structured process — from discovery to delivery — so you always know where we are and what's next." steps={RPM_STEPS} />
      <CTABanner title="Find the Right Service" body="Not sure where to start? We'll help you identify the highest-leverage RevOps investments for your stage." cta="Talk to an Expert" />
      <RPFooter />
    </div>
  );
}

function HubSpotPage() {
  const hubs = [
    { color:"#F7761E", icon:"hub",           title:"Marketing Hub",  body:"Full inbound marketing — campaigns, automation, lead scoring, and attribution." },
    { color:"#FB3131", icon:"attach_money",   title:"Sales Hub",      body:"Pipeline management, sequences, forecasting, and deal automation." },
    { color:"#329DFF", icon:"support_agent",  title:"Service Hub",    body:"Customer onboarding, ticketing, knowledge base, and NPS tracking." },
  ];
  return (
    <div>
      <RPHeader activePage="hubspot" />
      <section style={{background:"rgba(239,129,27,0.06)", padding:"80px 120px 64px"}}>
        <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:14,letterSpacing:"0.4em",textTransform:"uppercase",color:"#F7761E",marginBottom:16}}>HubSpot Partner</div>
        <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:56,lineHeight:1.1,color:"#24273A",maxWidth:700,marginBottom:20}}>We Live Inside HubSpot</h1>
        <p style={{fontFamily:"'Inter',sans-serif",fontSize:18,lineHeight:1.75,color:"#434761",maxWidth:560}}>
          As the only company in the world with Elite Accreditations from both HubSpot and Clay, we don't just recommend HubSpot — we engineer it. From portal cleanup to full multi-hub implementations.
        </p>
      </section>
      <section style={{padding:"64px 120px", display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:24}}>
        {hubs.map((h,i) => <ServiceCard key={i} {...h} link="Learn more" />)}
      </section>
      <TextImageSection
        eyebrow="HubSpot Onboarding"
        title="Onboarding Faster Than a Pit Crew"
        body="Our guided onboarding process gets your team live on HubSpot in weeks, not months — with full data migration, custom configuration, and team training included."
        cta="Start Onboarding"
        ctaSecondary="See the process"
        bg="#F3F3F4"
      />
      <CTABanner title="The Elite choice in GTM excellence" body="RevPartners is the only business in the world to hold Elite Accreditations with both HubSpot & Clay — giving you access to the top talent in the ecosystem." cta="Partner With Us" />
      <RPFooter />
    </div>
  );
}

function PricingPage() {
  const tiers = [
    { name:"Starter", price:"$4,000", period:"/mo", color:"#17B451", features:["RevOps audit & roadmap","HubSpot configuration","Monthly strategy call","Email + Slack support"], cta:"Get Started" },
    { name:"Growth",  price:"$8,500", period:"/mo", color:"#329DFF", featured:true, features:["Everything in Starter","Full inbound program","Sales sequence builds","Bi-weekly reviews","Dedicated RevOps engineer"], cta:"Get Started" },
    { name:"Scale",   price:"Custom", period:"",     color:"#8C32FF", features:["Everything in Growth","Multi-Hub implementation","Custom integrations","Weekly leadership reporting","Revenue Performance Model"], cta:"Talk to Sales" },
  ];
  return (
    <div>
      <RPHeader activePage="pricing" />
      <section style={{background:"rgba(23,180,81,0.06)",padding:"80px 120px 64px",textAlign:"center"}}>
        <h1 style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:56,lineHeight:1.1,color:"#24273A",marginBottom:16}}>Simple, Transparent Pricing</h1>
        <p style={{fontFamily:"'Inter',sans-serif",fontSize:18,lineHeight:1.75,color:"#434761"}}>Flat monthly retainers. No surprises. Cancel anytime.</p>
      </section>
      <section style={{padding:"64px 120px",display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:24,alignItems:"start"}}>
        {tiers.map((t,i) => (
          <div key={i} style={{
            background: t.featured ? `${t.color}14` : "#FDFDFD",
            border:`2px solid ${t.color}`,
            borderRadius:12,padding:32,display:"flex",flexDirection:"column",gap:20,
            transform:t.featured?"translateY(-8px)":"none",
            boxShadow:t.featured?"0 8px 24px rgba(0,0,0,0.08)":"none",
          }}>
            {t.featured && <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:11,letterSpacing:"0.2em",textTransform:"uppercase",color:t.color}}>Most Popular</div>}
            <div style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:22,color:"#24273A"}}>{t.name}</div>
            <div style={{display:"flex",alignItems:"baseline",gap:4}}>
              <span style={{fontFamily:"'Montserrat',sans-serif",fontWeight:700,fontSize:40,color:t.color}}>{t.price}</span>
              <span style={{fontFamily:"'Inter',sans-serif",fontSize:14,color:"#A1A2A7"}}>{t.period}</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {t.features.map((f,j)=>(
                <div key={j} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                  <span className="material-symbols-outlined" style={{fontSize:18,color:t.color,flexShrink:0,marginTop:1}}>check_circle</span>
                  <span style={{fontFamily:"'Inter',sans-serif",fontSize:14,color:"#434761",lineHeight:1.5}}>{f}</span>
                </div>
              ))}
            </div>
            <button style={{
              borderRadius:120,
              background:t.featured?t.color:"transparent",
              border:`2px solid ${t.color}`,color:t.featured?"#FDFDFD":t.color,
              fontFamily:"'Inter',sans-serif",fontWeight:600,fontSize:15,
              padding:"12px 24px",cursor:"pointer",marginTop:"auto",
            }}>{t.cta}</button>
          </div>
        ))}
      </section>
      <RPFooter />
    </div>
  );
}

// ── App shell with page switching ─────────────────────────────────

const PAGES = [
  { id:"home",     label:"Home",     Component: HomePage },
  { id:"revops",   label:"Services", Component: ServicesPage },
  { id:"hubspot",  label:"HubSpot",  Component: HubSpotPage },
  { id:"pricing",  label:"Pricing",  Component: PricingPage },
];

function App() {
  const [page, setPage] = React.useState("home");
  const current = PAGES.find(p => p.id === page);
  const { Component } = current;

  // Build tab bar
  React.useEffect(() => {
    const tabs = document.getElementById("tabs");
    if (!tabs) return;
    tabs.innerHTML = "";
    PAGES.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "page-tab" + (p.id === page ? " active" : "");
      btn.textContent = p.label;
      btn.onclick = () => setPage(p.id);
      tabs.appendChild(btn);
    });
  }, [page]);

  return <Component />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
