<!DOCTYPE html>
<!-- @dsCard group="Slides" name="Cover" subtitle="Main cover — dark, logo, title, Measure/Act/Repeat motif" viewport="1280x720" -->
<html lang="en"><head>
<meta charset="UTF-8">
<link rel="stylesheet" href="frame.css">
<style>
  .cover-pad { justify-content: center; gap: 0; }
  .cover-logo { height: 44px; width: auto; align-self: flex-start; margin-bottom: 64px; position: relative; z-index: 1; }
  .cover-copy { position: relative; z-index: 1; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
  /* Quiet lower-right fragment: top-left 2/3 of the SVG, bleeds off the bottom */
  .motif {
    position: absolute;
    right: 0;
    bottom: -40%;
    width: 45%;
    height: auto;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .motif img {
    width: 200%;
    height: 200%;
    max-width: none;
    object-fit: cover;
    object-position: left top;
    opacity: 0.38;
  }
</style>
</head>
<body>
<div class="slide dark">
  <div class="motif" aria-hidden="true">
    <img src="../illustrations/Drawings/Infographic - Measure Act Repeat Gray.svg" alt="">
  </div>
  <div class="pad cover-pad">
    <img class="cover-logo" src="../assets/RevPartners-Logo-2024-Green-on-Dark.svg" alt="RevPartners">
    <div class="cover-copy">
      <h1 class="title" style="font-size:56px;line-height:1.08">Master Slide Deck Template</h1>
      <p class="lead" style="font-size:22px">More experience, better value, less risk.</p>
    </div>
  </div>
  <div class="footline thick"><i class="fl-b"></i><i class="fl-y"></i><i class="fl-gap"></i><i class="fl-r"></i></div>
</div>
</body></html>
